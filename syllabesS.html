<p id="syllabe"></p>
<div id="boutons-controle">
    <button type="button" class="btn" id="boutonPause" onclick="basculerPause()" style="background-color: #BF70E4;">⏸ Pause</button>
    <button type="button" class="btn" onclick="updateSyllabe()" style="background-color: #C994E2;">Syllabe suivante</button>
</div>
<div style="height:50px;" align='center'></div>
<div class="container-fluid">
    <table class="table table-sm" width="75%">
        <thead>
        <tr>
            <th style="background-color: #BF70E4;" colspan="7" scope="col"><label>Choisir un ou plusieurs sons :</label><br></th>
        </tr>
        </thead>
        <tbody id="corpsTable"></tbody>
    </table>
</div>
<script>
const sons = [
    {id: "list1", label: "l"}, {id: "list2", label: "r"}, {id: "list3", label: "m"},
    {id: "list4", label: "s"}, {id: "list5", label: "ch"}, {id: "list6", label: "f"},
    {id: "list7", label: "n"}, {id: "list8", label: "v"}, {id: "list9", label: "j"},
    {id: "list10", label: "z"}, {id: "list11", label: "p"}, {id: "list12", label: "t"},
    {id: "list13", label: "c"}, {id: "list14", label: "d"}, {id: "list15", label: "g"},
    {id: "list16", label: "b"}, {id: "list17", label: "ou"}, {id: "list18", label: "an en"},
    {id: "list19", label: "on om"}, {id: "list20", label: "in im"}, {id: "list21", label: "oi"},
    {id: "list22", label: "oin"}, {id: "list23", label: "ui"}, {id: "list24", label: "eu œu"},
    {id: "list25", label: "gn"}, {id: "list26", label: "i y"}, {id: "list27", label: "x"},
    {id: "list28", label: "au eau"}, {id: "list29", label: "ai ei et"}, {id: "list30", label: "elle ette erre ..."},
    {id: "list31", label: "qu k ch"}, {id: "list32", label: "er ez"}, {id: "list33", label: "ain ein"},
    {id: "list34", label: "ph"}, {id: "list35", label: "am em"}, {id: "list36", label: "ç"},
    {id: "list37", label: "g ge"}, {id: "list38", label: "s"}, {id: "list39", label: "gu"},
    {id: "list40", label: "ill"}, {id: "list41", label: "ail eil ouil euil"}
];

const files = ["listes/l.txt", "listes/r.txt", "listes/m.txt", "listes/s.txt", "listes/ch.txt", "listes/f.txt", "listes/n.txt", "listes/v.txt", "listes/j.txt", "listes/z.txt", "listes/p.txt", "listes/t.txt", "listes/c.txt", "listes/d.txt", "listes/g.txt", "listes/b.txt", "listes/ou.txt", "listes/enan.txt", "listes/onom.txt", "listes/inim.txt", "listes/oi.txt", "listes/oin.txt", "listes/ui.txt", "listes/euoeu.txt", "listes/gn.txt", "listes/iy.txt", "listes/x.txt", "listes/aueau.txt", "listes/aieiet.txt", "listes/elleetteerreesseenne.txt", "listes/quk.txt", "listes/erez.txt", "listes/ainein.txt", "listes/ph.txt", "listes/emam.txt", "listes/cçti.txt", "listes/gge.txt", "listes/sz.txt", "listes/gu.txt", "listes/ill.txt", "listes/ail.txt"];

const cacheListes = {};
let intervalID = null;
let enPause = false;

function construireTable() {
    const corps = document.getElementById("corpsTable");
    let html = "";
    for (let i = 0; i < sons.length; i += 7) {
        html += "<tr>";
        for (let j = i; j < Math.min(i + 7, sons.length); j++) {
            const couleur = (Math.floor(i / 7) % 2 === 0) ? "#D5C0DF" : "#C994E2";
            html += '<td style="background-color: ' + couleur + ';">';
            html += '<input type="checkbox" id="' + sons[j].id + '" value="' + j + '">';
            html += '<label for="' + sons[j].id + '">' + sons[j].label + '</label><br></td>';
        }
        html += "</tr>";
    }
    html += '<tr>';
    html += '<td style="background-color: #BF70E4;" colspan="2"><b>Syllabes par minute :</b>';
    html += '<select id="delai" onchange="changerDelai()">';
    html += '<option value="6000">10</option><option value="3000">20</option>';
    html += '<option value="2000">30</option><option value="1500">40</option>';
    html += '<option value="1200" selected>50 (CP)</option><option value="1000">60</option>';
    html += '<option value="858">70 (CE1)</option><option value="666">90 (CE2)</option>';
    html += '</select></td>';
    html += '<td style="background-color: #BF70E4;" colspan="2"><b>Police :</b>';
    html += '<select id="police" onchange="changerPolice()">';
    html += '<option value="Arial">Scripte</option><option value="opendys">Anti confusion</option>';
    html += '<option value="belleallure">Cursive</option><option value="bebasneue">Capitale</option>';
    html += '</select></td>';
    html += '<td style="background-color: #BF70E4;" colspan="1">';
    html += '<input type="checkbox" id="add2ToEnd">';
    html += '<label for="add2ToEnd"><b>Inversion</b></label></td>';
    html += '<td style="background-color: #BF70E4;" colspan="2">';
    html += '<input type="checkbox" id="colorerVoyellesConsonnes">';
    html += '<label for="colorerVoyellesConsonnes"><b>Ajouter des couleurs</b></label></td>';
    html += '</tr>';
    corps.innerHTML = html;
}

function adjustFontSize() {
    const syllabeElement = document.getElementById("syllabe");
    const windowWidth = window.innerWidth;
    const syllabeText = syllabeElement.textContent.trim();
    const syllabeLength = Math.max(syllabeText.length, 1);
    const maxFontSize = Math.min(windowWidth / (syllabeLength * 0.7), 300);
    syllabeElement.style.fontSize = maxFontSize + "px";
}
window.addEventListener("load", adjustFontSize);
window.addEventListener("resize", adjustFontSize);

async function chargerListe(file) {
    if (cacheListes[file]) {
        return cacheListes[file];
    }
    try {
        const response = await fetch(file);
        if (!response.ok) {
            throw new Error("Impossible de charger " + file);
        }
        const text = await response.text();
        const syllables = text.trim().split("\n").filter(function(s) { return s.trim().length > 0; });
        cacheListes[file] = syllables;
        return syllables;
    } catch (error) {
        console.error(error);
        cacheListes[file] = [];
        return [];
    }
}

function chooseRandomElement(array) {
    return array[Math.floor(Math.random() * array.length)];
}

const voyelles = ['a', 'e', 'i', 'o', 'u', 'y', 'é', 'è', 'ê', 'ë'];
const consonnes = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'z', 'ç'];
const groupeSpecial1 = ['ch', 'ou', 'en', 'an', 'on', 'om', 'in', 'im', 'oi', 'ui', 'eu', 'œu', 'gn', 'au', 'ai', 'ei', 'et', 'qu', 'er', 'ez', 'ph', 'am', 'em', 'ge', 'gu'];
const groupeSpecial2 = ['eau', 'oin', 'elle', 'ette', 'erre', 'esse', 'enne', 'ain', 'ein', 'ail', 'eil', 'ouil', 'euil', 'aill', 'eill', 'ouill', 'euill', 'ill'];

function colorerSyllabe(syllabe, colorer) {
    let html = '';
    let i = 0;
    while (i < syllabe.length) {
        let traite = false;
        for (let j = 0; j < groupeSpecial2.length; j++) {
            const groupe = groupeSpecial2[j];
            if (syllabe.slice(i, i + groupe.length) === groupe) {
                html += colorer ? '<span class="jaune">' + groupe + '</span>' : groupe;
                i += groupe.length;
                traite = true;
                break;
            }
        }
        if (!traite) {
            for (let j = 0; j < groupeSpecial1.length; j++) {
                const groupe = groupeSpecial1[j];
                if (syllabe.slice(i, i + groupe.length) === groupe) {
                    html += colorer ? '<span class="special1">' + groupe + '</span>' : groupe;
                    i += groupe.length;
                    traite = true;
                    break;
                }
            }
        }
        if (!traite) {
            const char = syllabe[i];
            if (colorer && voyelles.includes(char.toLowerCase())) {
                html += '<span class="voyelle">' + char + '</span>';
            } else if (colorer && consonnes.includes(char.toLowerCase())) {
                html += '<span class="consonne">' + char + '</span>';
            } else {
                html += char;
            }
            i++;
        }
    }
    return html;
}

async function updateSyllabe() {
    const syllabeElement = document.getElementById("syllabe");
    const selectedFiles = [];
    for (let i = 0; i < sons.length; i++) {
        if (document.getElementById(sons[i].id).checked) {
            selectedFiles.push(files[i]);
        }
    }

    if (selectedFiles.length === 0) {
        syllabeElement.textContent = "ⵔⴲⵔ";
        adjustFontSize();
        return;
    }

    const colorer = document.getElementById("colorerVoyellesConsonnes").checked;
    const randomFile = chooseRandomElement(selectedFiles);
    const syllables = await chargerListe(randomFile);

    if (syllables.length === 0) {
        syllabeElement.textContent = "ⵔⴲⵔ";
        adjustFontSize();
        return;
    }

    const randomSyllable = chooseRandomElement(syllables).trim();
    syllabeElement.innerHTML = colorerSyllabe(randomSyllable, colorer);
    adjustFontSize();
}

function demarrerIntervalle() {
    clearInterval(intervalID);
    const delai = parseInt(document.getElementById("delai").value, 10);
    intervalID = setInterval(updateSyllabe, delai);
}

function basculerPause() {
    enPause = !enPause;
    const bouton = document.getElementById("boutonPause");
    if (enPause) {
        clearInterval(intervalID);
        intervalID = null;
        bouton.textContent = "▶ Reprendre";
        bouton.style.backgroundColor = "#30B441";
    } else {
        demarrerIntervalle();
        bouton.textContent = "⏸ Pause";
        bouton.style.backgroundColor = "#BF70E4";
    }
}

function changerDelai() {
    if (!enPause) {
        demarrerIntervalle();
    }
}

function changerPolice() {
    const policeSelectionnee = document.getElementById("police").value;
    document.getElementById("syllabe").style.fontFamily = policeSelectionnee;
}

construireTable();

for (let i = 0; i < sons.length; i++) {
    document.getElementById(sons[i].id).addEventListener("change", updateSyllabe);
}

document.getElementById("add2ToEnd").addEventListener("change", function() {
    for (let i = 0; i < files.length; i++) {
        if (this.checked) {
            files[i] = files[i].replace(/\.txt$/, "2.txt");
        } else {
            files[i] = files[i].replace(/2\.txt$/, ".txt");
        }
    }
    updateSyllabe();
});

changerPolice();
updateSyllabe();
demarrerIntervalle();
</script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
