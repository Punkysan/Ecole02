let intervalID;

// Fonction pour charger un fichier texte de manière asynchrone
async function loadFile(file) {
    try {
        const response = await fetch(file);
        if (!response.ok) {
            throw new Error('Ø');
        }
        const text = await response.text();
        return text;
    } catch (error) {
        console.error(error);
    }
}

// Fonction pour choisir aléatoirement un élément dans un tableau
function chooseRandomElement(array) {
    return array[Math.floor(Math.random() * array.length)];
}

// Fonction pour générer une syllabe aléatoire à partir d'une liste spécifique
async function generateRandomSyllableFromList(file) {
    const fileContent = await loadFile(file);
    if (fileContent) {
        const syllables = fileContent.trim().split("\n");
        const randomSyllable = chooseRandomElement(syllables);
        return randomSyllable;
    } else {
        return "Ø";
    }
}

// Fonction pour mettre à jour le contenu de la page avec une syllabe aléatoire
async function updateSyllabe() {
    const syllabeElement = document.getElementById("syllabe");
    const selectedFiles = [];
    if (document.getElementById("list1").checked) selectedFiles.push(files[0]);
    if (document.getElementById("list2").checked) selectedFiles.push(files[1]);
    if (document.getElementById("list3").checked) selectedFiles.push(files[2]);

    if (document.getElementById("list9").checked) selectedFiles.push(files[8]);
    if (document.getElementById("list10").checked) selectedFiles.push(files[9]);

    if (document.getElementById("list12").checked) selectedFiles.push(files[11]);
    if (document.getElementById("list13").checked) selectedFiles.push(files[12]);
    if (document.getElementById("list14").checked) selectedFiles.push(files[13]);
    if (document.getElementById("list15").checked) selectedFiles.push(files[14]);
    if (document.getElementById("list16").checked) selectedFiles.push(files[15]);
    if (document.getElementById("list17").checked) selectedFiles.push(files[16]);
    if (document.getElementById("list18").checked) selectedFiles.push(files[17]);
	if (document.getElementById("list19").checked) selectedFiles.push(files[18]);
	if (document.getElementById("list20").checked) selectedFiles.push(files[19]);
	if (document.getElementById("list21").checked) selectedFiles.push(files[20]);
	if (document.getElementById("list22").checked) selectedFiles.push(files[21]);
	if (document.getElementById("list23").checked) selectedFiles.push(files[22]);
	if (document.getElementById("list24").checked) selectedFiles.push(files[23]);
	if (document.getElementById("list25").checked) selectedFiles.push(files[24]);
	if (document.getElementById("list26").checked) selectedFiles.push(files[25]);
	if (document.getElementById("list27").checked) selectedFiles.push(files[26]);
	if (document.getElementById("list28").checked) selectedFiles.push(files[27]);
	if (document.getElementById("list29").checked) selectedFiles.push(files[28]);
	if (document.getElementById("list30").checked) selectedFiles.push(files[29]);
	if (document.getElementById("list31").checked) selectedFiles.push(files[30]);
	if (document.getElementById("list32").checked) selectedFiles.push(files[31]);
	if (document.getElementById("list33").checked) selectedFiles.push(files[32]);
	if (document.getElementById("list34").checked) selectedFiles.push(files[33]);
	if (document.getElementById("list35").checked) selectedFiles.push(files[34]);
	if (document.getElementById("list36").checked) selectedFiles.push(files[35]);

    const colorerVoyellesConsonnesCheckbox = document.getElementById("colorerVoyellesConsonnes");
    const colorerVoyellesConsonnes = colorerVoyellesConsonnesCheckbox.checked; // Vérifier si la case à cocher est cochée

    if (selectedFiles.length === 0) {
        syllabeElement.textContent = "ᵔᴥᵔ";
        return;
    }
    const randomFile = chooseRandomElement(selectedFiles);
    const randomSyllable = await generateRandomSyllableFromList(randomFile);

    let syllabeHtml = '';
    const voyelles = ['a', 'e', 'i', 'o', 'u', 'y', 'é', 'è', 'ê', 'ë'];
    const consonnes = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'z'];
    const groupesSpeciaux = ['ch', 'ou', 'en', 'an', 'on', 'om', 'in', 'im', 'oi', 'oin', 'ui', 'eu', 'œu', 'gn']; // Ajout des groupes spéciaux

    let i = 0;
    while (i < randomSyllable.length) {
        const char = randomSyllable[i];
        let isSpecialGroup = false;
        for (let j = 0; j < groupesSpeciaux.length; j++) {
            const specialGroup = groupesSpeciaux[j];
            if (randomSyllable.slice(i, i + specialGroup.length) === specialGroup) {
                if (colorerVoyellesConsonnes) {
                    syllabeHtml += `<span class="special">${specialGroup}</span>`;
                } else {
                    syllabeHtml += specialGroup;
                }
                i += specialGroup.length;
                isSpecialGroup = true;
                break;
            }
        }
        if (!isSpecialGroup) {
            if (voyelles.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="voyelle">${char}</span>`;
            } else if (consonnes.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="consonne">${char}</span>`;
            } else {
                syllabeHtml += char;
            }
            i++;
        }
    }

    syllabeElement.innerHTML = syllabeHtml;
}

// Ajouter un écouteur d'événement au champ de saisie de délai pour mettre à jour l'intervalle
document.getElementById("delai").addEventListener("input", function() {
    const delai = parseInt(this.value);
    clearInterval(intervalID); // Arrêter l'ancien intervalle
    intervalID = setInterval(updateSyllabe, delai); // Mettre à jour le nouvel intervalle
});

// Récupérer la case à cocher pour ajouter '2' à la fin des noms de fichiers
const add2ToEndCheckbox = document.getElementById("add2ToEnd");

// Ajouter un écouteur d'événement pour détecter le changement d'état de la case à cocher
add2ToEndCheckbox.addEventListener("change", function() {
    // Modifier les noms de fichiers si la case est cochée
    if (this.checked) {
        files.forEach((file, index) => {
            files[index] = file.replace(/\.txt$/, "2.txt");
        });
    } else {
        // Rétablir les noms de fichiers originaux si la case est décochée
        files.forEach((file, index) => {
            files[index] = file.replace(/2\.txt$/, ".txt");
        });
    }
    // Mettre à jour la syllabe avec les nouveaux fichiers si nécessaire
    updateSyllabe();
});


// Mettre en place l'intervalle initial avec un délai de 1500 millisecondes
intervalID = setInterval(updateSyllabe, 1500);
