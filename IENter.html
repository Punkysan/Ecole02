<script>
const files = ["../listIEN/IEN1.txt", "../listIEN/IEN2.txt", "../listIEN/IEN3.txt", "../listIEN/IEN4.txt", "../listIEN/IEN5.txt", "../listIEN/IEN6.txt", "../listIEN/IEN7.txt", "../listIEN/IEN8.txt", "../listIEN/IEN9.txt", "../listIEN/IEN10.txt", "../listIEN/IEN11.txt", "../listIEN/IEN12.txt", "../listIEN/IEN13.txt", "../listIEN/IEN14.txt", "../listIEN/IEN15.txt", "../listIEN/IEN16.txt", "../listIEN/IEN17.txt", "../listIEN/IEN18.txt", "../listIEN/IEN19.txt", "../listIEN/IEN20.txt", "../listIEN/IEN21.txt", "../listIEN/IEN22.txt", "../listIEN/IEN23.txt", "../listIEN/IEN24.txt", "../listIEN/IEN25.txt", "../listIEN/IEN26.txt", "../listIEN/IEN27.txt", "../listIEN/IEN28.txt", "../listIEN/IEN29.txt", "../listIEN/IEN30.txt", "../listIEN/IEN31.txt", "../listIEN/IEN32.txt", "../listIEN/IEN33.txt", "../listIEN/IEN34.txt", "../listIEN/IEN35.txt", "../listIEN/IEN36.txt", "../listIEN/IEN37.txt", "../listIEN/IEN38.txt", "../listIEN/IEN39.txt", "../listIEN/IEN40.txt"];
let intervalID;
let isPaused = false; // Initialement, il n'est pas en pause
let currentIndex = 0;
let syllablesList = [];
let selectedFiles = [];
let delay = parseInt(document.getElementById("delai").value);

async function loadFile(file) {
    try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Ø');
        return await response.text();
    } catch (error) {
        console.error(error);
    }
}

async function loadSelectedFiles() {
    syllablesList = [];
    selectedFiles = [];
    currentIndex = 0;

    const listSelect = document.getElementById("listSelect");
    const selectedValue = listSelect.value;
    if (selectedValue !== "") {
        selectedFiles.push(files[parseInt(selectedValue)]);
    }

    if (selectedFiles.length === 0) {
        document.getElementById("syllabe").textContent = "ᵔᴥᵔ";
        return;
    }

    const fileContents = await Promise.all(selectedFiles.map(file => loadFile(file)));
    fileContents.forEach(content => {
        if (content) {
            syllablesList.push(...content.trim().split("\n"));
        }
    });

    startSyllableInterval();
}

function startSyllableInterval() {
    if (!isPaused) {
        updateSyllabe();
    }
}

function updateSyllabe() {
    if (isPaused || currentIndex >= syllablesList.length) {
        if (currentIndex >= syllablesList.length) {
            document.getElementById("syllabe").textContent = "fin";
        }
        return;
    }

    const syllabeElement = document.getElementById("syllabe");
    const randomSyllabe = syllablesList[currentIndex];
    currentIndex++;

    const colorerVoyellesConsonnes = document.getElementById("colorerVoyellesConsonnes").checked;
    let syllabeHtml = '';
    const voyelles = ['a', 'e', 'i', 'o', 'u', 'y', 'é', 'è', 'ê', 'ë'];
    const consonnes = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'z', 'ç', 'k'];
    const groupeSpecial1 = ['ch', 'ou', 'en', 'an', 'on', 'om', 'in', 'im', 'oi', 'ui', 'eu', 'œu', 'gn', 'au', 'ai', 'ei', 'et', 'qu', 'er', 'ez', 'ph', 'am', 'em', 'ge', 'gu'];
    const groupeSpecial2 = ['eau', 'oin', 'elle', 'ette', 'erre', 'esse', 'enne', 'ain', 'ein', 'ail', 'eil', 'ouil', 'euil', 'aill', 'eill', 'ouill', 'euill', 'ill'];

    let i = 0;
    while (i < randomSyllabe.length) {
        const char = randomSyllabe[i];
        let isSpecialGroup = false;
        for (let j = 0; j < groupeSpecial2.length; j++) {
            const specialGroup = groupeSpecial2[j];
            if (randomSyllabe.slice(i, i + specialGroup.length) === specialGroup) {
                syllabeHtml += colorerVoyellesConsonnes ? `<span class="jaune">${specialGroup}</span>` : specialGroup;
                i += specialGroup.length;
                isSpecialGroup = true;
                break;
            }
        }
        if (!isSpecialGroup) {
            for (let j = 0; j < groupeSpecial1.length; j++) {
                const specialGroup = groupeSpecial1[j];
                if (randomSyllabe.slice(i, i + specialGroup.length) === specialGroup) {
                    syllabeHtml += colorerVoyellesConsonnes ? `<span class="special1">${specialGroup}</span>` : specialGroup;
                    i += specialGroup.length;
                    isSpecialGroup = true;
                    break;
                }
            }
        }
        if (!isSpecialGroup) {
            if (voyelles.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="voyelle">${char}</span>`;
            } else if (consonnes.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="consonne">${char}</span>`;
            } else {
                syllabeHtml += char;
            }
            i++;
        }
    }
    syllabeElement.innerHTML = syllabeHtml;

    if (!isPaused) {
        intervalID = setTimeout(updateSyllabe, delay);
    }
}

function updateSyllabeDisplay() {
    const syllabeElement = document.getElementById("syllabe");
    const randomSyllabe = syllablesList[currentIndex];

    const colorerVoyellesConsonnes = document.getElementById("colorerVoyellesConsonnes").checked;
    let syllabeHtml = '';
    const voyelles = ['a', 'e', 'i', 'o', 'u', 'y', 'é', 'è', 'ê', 'ë'];
    const consonnes = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'z', 'ç', 'k'];
    const groupeSpecial1 = ['ch', 'ou', 'en', 'an', 'on', 'om', 'in', 'im', 'oi', 'ui', 'eu', 'œu', 'gn', 'au', 'ai', 'ei', 'et', 'qu', 'er', 'ez', 'ph', 'am', 'em', 'ge', 'gu'];
    const groupeSpecial2 = ['eau', 'oin', 'elle', 'ette', 'erre', 'esse', 'enne', 'ain', 'ein', 'ail', 'eil', 'ouil', 'euil', 'aill', 'eill', 'ouill', 'euill', 'ill'];

    let i = 0;
    while (i < randomSyllabe.length) {
        const char = randomSyllabe[i];
        let isSpecialGroup = false;
        for (let j = 0; j < groupeSpecial2.length; j++) {
            const specialGroup = groupeSpecial2[j];
            if (randomSyllabe.slice(i, i + specialGroup.length) === specialGroup) {
                syllabeHtml += colorerVoyellesConsonnes ? `<span class="jaune">${specialGroup}</span>` : specialGroup;
                i += specialGroup.length;
                isSpecialGroup = true;
                break;
            }
        }
        if (!isSpecialGroup) {
            for (let j = 0; j < groupeSpecial1.length; j++) {
                const specialGroup = groupeSpecial1[j];
                if (randomSyllabe.slice(i, i + specialGroup.length) === specialGroup) {
                    syllabeHtml += colorerVoyellesConsonnes ? `<span class="special1">${specialGroup}</span>` : specialGroup;
                    i += specialGroup.length;
                    isSpecialGroup = true;
                    break;
                }
            }
        }
        if (!isSpecialGroup) {
            if (voyelles.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="voyelle">${char}</span>`;
            } else if (consonnes.includes(char.toLowerCase()) && colorerVoyellesConsonnes) {
                syllabeHtml += `<span class="consonne">${char}</span>`;
            } else {
                syllabeHtml += char;
            }
            i++;
        }
    }
    syllabeElement.innerHTML = syllabeHtml;
}

document.getElementById("listSelect").addEventListener("change", loadSelectedFiles);

document.getElementById("delai").addEventListener("input", function() {
    delay = parseInt(this.value);
    if (!isPaused) {
        clearTimeout(intervalID);
        startSyllableInterval();
    }
});

document.getElementById("pauseButton").addEventListener("click", function() {
    if (isPaused) {
        // Redémarrer la lecture
        isPaused = false;
        startSyllableInterval();
        this.textContent = "Pause";
    } else {
        // Mettre en pause la lecture
        isPaused = true;
        clearTimeout(intervalID);
        this.textContent = "Reprendre";
    }
});

document.getElementById("restartButton").addEventListener("click", function() {
    // Réinitialiser l'index et redémarrer la lecture
    currentIndex = 0;
    isPaused = false;
    clearTimeout(intervalID);
    startSyllableInterval();
    document.getElementById("pauseButton").textContent = "Pause";
});

document.getElementById("prevButton").addEventListener("click", function() {
    if (currentIndex > 0) {
        currentIndex--;
        updateSyllabeDisplay();
    }
});

document.getElementById("nextButton").addEventListener("click", function() {
    if (currentIndex < syllablesList.length - 1) {
        currentIndex++;
        updateSyllabeDisplay();
    }
});

function changerPolice() {
    const policeSelectionnee = document.getElementById("police").value;
    document.getElementById("syllabe").style.fontFamily = policeSelectionnee;
}

document.getElementById("police").addEventListener("change", changerPolice);

changerPolice();
loadSelectedFiles();

</script>
