		<div style="height:75px;" align='center'></div>
		<div style="background-color: #D5C0DF;" class="menu">
			<table>
				<tr>
					<td style="background-color: #D5C0DF;"><label for="mots">Mots  :</label></td>
					<td style="background-color: #D5C0DF;"><input type="text" id="mots" name="mots"><br></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><label for="duree">Durée :</label></td>
					<td style="background-color: #D5C0DF;"><input type="number" id="duree" name="duree" value="1" min="0.2" step="0.1"><br></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><label for="police">Police :</label></td>
					<td style="background-color: #D5C0DF;"><select id="police" name="police">
						<option value="Arial">Arial</option>
						<option value="Times New Roman">Times New Roman</option>
						<option value="Courier New">Courier New</option>
						<option value="Calibri">Calibri</option>
						<option value="Verdana" selected>Verdana</option>
					</select><br></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><label for="taille">Taille :</label></td>
					<td style="background-color: #D5C0DF;"><input type="number" id="taille" name="taille" value="350"><br> <!-- Taille de police minimale --></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><input type="checkbox" id="melanger" name="melanger"></td>
					<td style="background-color: #D5C0DF;"><label for="melanger">Mélanger les mots</label><br></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><input type="checkbox" id="auto" name="auto" checked></td>
					<td style="background-color: #D5C0DF;"><label for="auto">Lecture automatique</label><br></td>
				</tr>
				<tr>
					<td style="background-color: #D5C0DF;"><button type="button" class="btn" onclick="afficherMots()" style="background-color: #C994E2;">Afficher</button></td>
					<td style="background-color: #D5C0DF;"><button type="button" class="btn" onclick="afficherMotSuivant()" style="background-color: #BF70E4;">Mot Suivant</button></td>
				</tr>
			</table>
			<p style="margin-top: 10px;">Astuce : la touche <b>Espace</b> affiche le mot suivant.</p>

		<div align="center">
			<div id="progression"></div>
			<div align="center" id="resultat"></div>
			<div id="stats"></div>
			<div style="margin-top: 20px;">
				<button type="button" class="btn btn-secondary" onclick="basculerPleinEcran()"> Plein écran</button>
				<button type="button" class="btn btn-secondary" onclick="recommencer()"> Recommencer</button>
			</div>
		</div>
		<script>
			var mots;
			var duree;
			var police;
			var tailleMin;
			var resultat;
			var progression;
			var stats;
			var motCourant = 0;
			var timer;
			var tempsDebut;
			var enCours = false;
			var nbMotsLus = 0;

			function melangerTableau(tableau) {
				for (var i = tableau.length - 1; i > 0; i--) {
					var j = Math.floor(Math.random() * (i + 1));
					var temp = tableau[i];
					tableau[i] = tableau[j];
					tableau[j] = temp;
				}
				return tableau;
			}

			function effacerMot() {
				resultat.innerHTML = "";
				if (enCours) {
					afficherMotSuivant();
				}
			}

			function ajusterTaillePolice(mot) {
				// Calculer la taille de police en fonction du nombre de caractères dans le mot
				var largeurFenetre = window.innerWidth * 0.9;
				var taillePolice = Math.min(largeurFenetre / mot.length, tailleMin);
				return taillePolice + "px";
			}

			function afficherMotSuivant() {
				clearTimeout(timer);
				if (motCourant < mots.length) {
					var motActuel = mots[motCourant];
					resultat.style.fontSize = ajusterTaillePolice(motActuel);
					resultat.innerHTML = motActuel;
					motCourant++;
					nbMotsLus++;
					progression.innerHTML = "Mot " + motCourant + " / " + mots.length;
					if (document.getElementById("auto").checked) {
						enCours = true;
						timer = setTimeout(effacerMot, duree * 1000);
					}
				} else {
					resultat.innerHTML = "";
					enCours = false;
					progression.innerHTML = "Terminé !";
					afficherStats();
					motCourant = 0;
				}
			}

			function afficherStats() {
				var tempsTotal = (Date.now() - tempsDebut) / 1000;
				var motsParMinute = Math.round((nbMotsLus / tempsTotal) * 60);
				stats.innerHTML = "⏱ " + nbMotsLus + " mots en " + tempsTotal.toFixed(1) + " s<br>📊 " + motsParMinute + " mots / minute";
			}

			function afficherMots() {
				mots = document.getElementById("mots").value.trim().split(/\s+/).filter(function(m) { return m.length > 0; });
				duree = parseFloat(document.getElementById("duree").value);
				police = document.getElementById("police").value;
				tailleMin = parseFloat(document.getElementById("taille").value);
				resultat = document.getElementById("resultat");
				progression = document.getElementById("progression");
				stats = document.getElementById("stats");
				motCourant = 0;
				nbMotsLus = 0;
				enCours = false;

				if (mots.length === 0) {
					progression.innerHTML = "Entrez des mots à afficher.";
					return;
				}

				if (document.getElementById("melanger").checked) {
					melangerTableau(mots);
				}

				resultat.style.fontFamily = police;
				stats.innerHTML = "";
				tempsDebut = Date.now();

				afficherMotSuivant();
			}

			function recommencer() {
				motCourant = 0;
				nbMotsLus = 0;
				enCours = false;
				clearTimeout(timer);
				resultat.innerHTML = "";
				stats.innerHTML = "";
				if (mots && mots.length > 0) {
					if (document.getElementById("melanger").checked) {
						melangerTableau(mots);
					}
					tempsDebut = Date.now();
					afficherMotSuivant();
				}
			}

			function basculerPleinEcran() {
				var element = document.documentElement;
				if (!document.fullscreenElement) {
					if (element.requestFullscreen) {
						element.requestFullscreen();
					} else if (element.webkitRequestFullscreen) {
						element.webkitRequestFullscreen();
					}
				} else {
					if (document.exitFullscreen) {
						document.exitFullscreen();
					} else if (document.webkitExitFullscreen) {
						document.webkitExitFullscreen();
					}
				}
			}

			// Ajouter un gestionnaire d'événements pour la touche "Entrée" sur le champ mots
			var inputMots = document.getElementById("mots");
			inputMots.addEventListener("keydown", function (event) {
				if (event.key === "Enter") {
					afficherMots();
				}
			});

			// Gestionnaire global : Espace ou Entrée = mot suivant
			document.addEventListener("keydown", function (event) {
				if (document.activeElement === inputMots) {
					return;
				}
				if (event.key === " " || event.key === "Enter") {
					event.preventDefault();
					afficherMotSuivant();
				}
			});
		</script>
