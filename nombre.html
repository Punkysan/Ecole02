		<div class="menu">
			<label for="min">Nombre minimal :</label>
			<input type="number" id="min" name="min" value="0"><br>
			<label for="max">Nombre maximal :</label>
			<input type="number" id="max" name="max" value="100"><br>
			<button type="button" class="btn" style="background-color: #BF70E4;" onclick="genererNombreAleatoire()">Générer</button>
		</div>
		<div align="center" class="resultat" id="resultat" style="font-size: 400px"></div>
		<script>
			function genererNombreAleatoire() {
				var min = parseInt(document.getElementById("min").value);
				var max = parseInt(document.getElementById("max").value);

				if (isNaN(min) || isNaN(max) || min >= max) {
					alert("Veuillez entrer des valeurs valides : min doit être inférieur à max.");
				} else {
					var nombreAleatoire = Math.floor(Math.random() * (max - min + 1)) + min;
					document.getElementById("resultat").innerHTML = "" + nombreAleatoire;
				}
			}
		</script>
