<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compléments à 10 - La Course aux Points !</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', Arial, sans-serif;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            background-image: url('https://cdn.pixabay.com/photo/2017/02/21/15/47/jungle-2086729_960_720.jpg');
            background-size: cover;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            font-size: 1.2rem;
        }

        .game-container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 80px auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        h1 {
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            margin: 0 0 40px 0;
            font-size: 4rem;
        }

        .progress-container {
            width: 80%;
            margin: 40px auto;
            background-color: #333;
            border-radius: 15px;
            height: 25px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #FF4500, #FFD700);
            transition: width 0.5s ease, background-color 0.5s ease;
            border-radius: 15px;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px;
            font-size: 32px;
        }

        .score {
            background-color: #FF8C00;
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .question {
            font-size: 64px;
            margin: 50px auto;
            color: #FFD700;
            max-width: 90%;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .reponses {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin: 50px auto;
            max-width: 800px;
        }

        button {
            font-size: 32px;
            padding: 20px 40px;
            background-color: #FF6347;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            font-family: 'Fredoka One', Arial, sans-serif;
            min-width: 100px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background-color: #FF4500;
            transform: scale(1.08);
        }

        #feedback {
            font-size: 48px;
            margin: 30px auto;
            min-height: 80px;
            font-family: 'Fredoka One', Arial, sans-serif;
        }

        #victory-message {
            font-size: 64px;
            color: #FFD700;
            margin: 40px auto;
            display: none;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f00;
            border-radius: 50%;
            pointer-events: none;
        }

        #next-level-btn {
            display: none;
            margin: 40px auto;
            padding: 20px 40px;
            background-color: #32CD32;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }

        #next-level-btn:hover {
            background-color: #228B22;
            transform: scale(1.08);
        }

        .visual-explanation {
            display: none;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            max-width: 700px;
        }

        .circles-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .circle-filled {
            background-color: #FF6347;
        }

        .circle-empty {
            background-color: rgba(255, 255, 255, 0.3);
            border: 3px dashed #FFD700;
        }

        .calculation {
            font-size: 48px;
            margin: 25px 0;
            color: #FFD700;
        }

        .banana {
            width: 80px;
            height: 80px;
            background-color: #FFD700;
            border-radius: 40px;
            margin: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #8B4513;
        }

        /* Adaptations spécifiques pour eleve2 et eleve1 */
        .visual-aid-for-eleve2 {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            font-size: 24px;
            color: #FFD700;
        }

        .explanation-text {
            font-size: 28px;
            margin: 20px 0;
            color: #FFD700;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌿 Compléments à 10 - La Course aux Points ! 🌿</h1>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div class="score-container">
            <div>Niveau : <span id="niveau">1</span></div>
            <div class="score">Score : <span id="score">0</span>/5</div>
        </div>

        <div id="victory-message">
            🎉 Félicitations ! Tu as atteint 5 points ! 🎉
        </div>

        <div class="question">
            Qu'est-ce qui manque à <span id="nombre">4</span> pour faire 10&nbsp;?
        </div>

        <div class="visual-explanation" id="visual-explanation">
            <div class="calculation" id="calculation-text">4 + 6 = 10</div>
            <div class="circles-container" id="circles-container">
                <!-- Les cercles seront ajoutés par JavaScript -->
            </div>
            <div class="visual-aid-for-eleve2" id="visual-aid-for-eleve2">
                <!-- Aide visuelle spécifique pour eleve2 -->
            </div>
            <div class="explanation-text" id="explanation-text">
                <!-- Explications textuelles pour eleve1 -->
            </div>
        </div>

        <div class="reponses" id="reponses">
            <!-- Les boutons seront ajoutés par JavaScript -->
        </div>

        <div id="feedback"></div>

        <button id="next-level-btn">Passer au niveau suivant</button>
    </div>

    <div id="fireworks"></div>

    <script>
        // Variables globales
        let score = 0;
        let niveau = 1;
        const maxScore = 5;
        const progressBar = document.getElementById("progress-bar");
        const victoryMessage = document.getElementById("victory-message");
        const nextLevelBtn = document.getElementById("next-level-btn");
        const visualExplanation = document.getElementById("visual-explanation");
        const calculationText = document.getElementById("calculation-text");
        const circlesContainer = document.getElementById("circles-container");
        const visualAidForeleve2 = document.getElementById("visual-aid-for-eleve2");
        const explanationText = document.getElementById("explanation-text");

        // Générer une question aléatoire
        function genererQuestion() {
            let min = 1;
            let max = 9;
            if (niveau === 1) max = 5; // Niveau 1 plus simple pour eleve2
            const nombre = Math.floor(Math.random() * (max - min + 1)) + min;
            const bonneReponse = 10 - nombre;

            // Générer 3 leurres (réponses fausses)
            const leurres = [];
            while (leurres.length < 3) {
                const leurre = Math.floor(Math.random() * 9) + 1;
                if (leurre !== bonneReponse && !leurres.includes(leurre)) {
                    leurres.push(leurre);
                }
            }

            // Mélanger la bonne réponse avec les leurres
            const reponses = [...leurres, bonneReponse].sort(() => Math.random() - 0.5);
            return { nombre, bonneReponse, reponses };
        }

        // Afficher une question
        function afficherQuestion() {
            const { nombre, bonneReponse, reponses } = genererQuestion();
            document.getElementById("nombre").textContent = nombre;
            const reponsesDiv = document.getElementById("reponses");
            reponsesDiv.innerHTML = "";

            reponses.forEach(reponse => {
                const bouton = document.createElement("button");
                bouton.textContent = reponse;
                bouton.onclick = () => verifierReponse(reponse, bonneReponse, nombre);
                reponsesDiv.appendChild(bouton);
            });

            document.getElementById("feedback").textContent = "";
            visualExplanation.style.display = "none";
        }

        // Afficher l'explication visuelle
        function afficherExplicationVisuelle(nombre, bonneReponse) {
            // Afficher le calcul
            calculationText.textContent = nombre + " + " + bonneReponse + " = 10";

            // Créer les cercles
            circlesContainer.innerHTML = "";

            // Cercles pleins (nombre initial)
            for (let i = 0; i < nombre; i++) {
                const circle = document.createElement("div");
                circle.className = "circle circle-filled";
                circle.textContent = i < 9 ? (i + 1) : "";
                circlesContainer.appendChild(circle);
            }

            // Cercles vides (complément)
            for (let i = 0; i < bonneReponse; i++) {
                const circle = document.createElement("div");
                circle.className = "circle circle-empty";
                circle.textContent = nombre + i + 1 <= 9 ? (nombre + i + 1) : "";
                circlesContainer.appendChild(circle);
            }

            // Alternative avec des bananes pour le niveau 1 (pour eleve2)
            if (niveau === 1) {
                circlesContainer.innerHTML = "";
                for (let i = 0; i < nombre; i++) {
                    const banana = document.createElement("div");
                    banana.className = "banana";
                    banana.textContent = "🍌";
                    circlesContainer.appendChild(banana);
                }

                for (let i = 0; i < bonneReponse; i++) {
                    const banana = document.createElement("div");
                    banana.className = "banana";
                    banana.style.opacity = "0.3";
                    banana.textContent = "🍌";
                    circlesContainer.appendChild(banana);
                }

                // Explication spécifique pour eleve2
                visualAidForeleve2.innerHTML = `
                    <div>Il y a ${nombre} bananes. Combien en manque-t-il pour avoir 10 bananes ?</div>
                `;
            }

            // Explication textuelle pour eleve1
            explanationText.innerHTML = `
                <div>Pour trouver le complément à 10, on peut compter :</div>
                <div>${nombre} + ${bonneReponse} = 10</div>
                <div>On peut aussi utiliser ses doigts : ${nombre} doigts levés + ${bonneReponse} doigts levés = 10 doigts !</div>
            `;

            visualExplanation.style.display = "block";
        }

        // Mettre à jour la barre de progression
        function majProgressBar() {
            const pourcentage = (score / maxScore) * 100;
            progressBar.style.width = pourcentage + "%";

            if (pourcentage < 30) {
                progressBar.style.background = "linear-gradient(to right, #FF4500, #FF8C00)";
            } else if (pourcentage < 70) {
                progressBar.style.background = "linear-gradient(to right, #FF8C00, #FFD700)";
            } else {
                progressBar.style.background = "linear-gradient(to right, #FFD700, #32CD32)";
            }
        }

        // Vérifier la réponse
        function verifierReponse(reponse, bonneReponse, nombre) {
            const feedback = document.getElementById("feedback");
            if (reponse === bonneReponse) {
                feedback.innerHTML = "✅ Bravo ! +1 point";
                feedback.style.color = "#32CD32";
                score++;
                document.getElementById("score").textContent = score;
                majProgressBar();

                if (score >= maxScore) {
                    lancerFeuxArtifice();
                    victoryMessage.style.display = "block";
                    nextLevelBtn.style.display = "block";
                    document.getElementById("reponses").style.display = "none";
                } else {
                    setTimeout(afficherQuestion, 1500);
                }
            } else {
                feedback.innerHTML = "❌ Essaie encore !";
                feedback.style.color = "#FF4500";
                afficherExplicationVisuelle(nombre, bonneReponse);
            }
        }

        // Réinitialiser le jeu
        function reinitialiserJeu() {
            score = 0;
            niveau = Math.min(niveau + 1, 2);
            document.getElementById("score").textContent = score;
            document.getElementById("niveau").textContent = niveau;
            majProgressBar();
            victoryMessage.style.display = "none";
            nextLevelBtn.style.display = "none";
            document.getElementById("reponses").style.display = "flex";
            afficherQuestion();
        }

        // Animation de feux d'artifice
        function lancerFeuxArtifice() {
            const fireworks = document.getElementById("fireworks");
            fireworks.style.display = "block";
            fireworks.innerHTML = "";

            for (let i = 0; i < 100; i++) { // Plus de confettis pour UHD
                const confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = Math.random() * 100 + "%";
                confetti.style.top = Math.random() * 100 + "%";
                confetti.style.backgroundColor = "hsl(" + Math.random() * 360 + ", 100%, 50%)";
                fireworks.appendChild(confetti);

                confetti.animate([
                    { transform: "translateY(0) rotate(0deg)", opacity: 1 },
                    { transform: "translateY(" + (Math.random() > 0.5 ? "-" : "") + (Math.random() * 200 + 100) + "px) rotate(" + Math.random() * 360 + "deg)", opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 2000,
                    easing: "cubic-bezier(0.1, 0.8, 0.2, 1)"
                }).onfinish = () => confetti.remove();
            }

            setTimeout(() => {
                fireworks.style.display = "none";
            }, 3000);
        }

        // Lancer la première question
        afficherQuestion();

        // Événement pour le bouton "Passer au niveau suivant"
        nextLevelBtn.addEventListener("click", reinitialiserJeu);
    </script>
</body>
</html>
