// Fonction pour charger un fichier texte de manière asynchrone
async function loadFile(file) {
    try {
        const response = await fetch(file);
        if (!response.ok) {
            throw new Error('Ø');
        }
        const text = await response.text();
        return text;
    } catch (error) {
        console.error(error);
    }
}

// Fonction pour choisir aléatoirement un élément dans un tableau
function chooseRandomElement(array) {
    return array[Math.floor(Math.random() * array.length)];
}

// Fonction pour générer une syllabe aléatoire à partir d'une liste spécifique
async function generateRandomSyllableFromList(file) {
    const fileContent = await loadFile(file);
    if (fileContent) {
        const syllables = fileContent.trim().split("\n");
        const randomSyllable = chooseRandomElement(syllables);
        return randomSyllable;
    } else {
        return "Ø";
    }
}

// Récupérer la case à cocher pour ajouter '2' à la fin des noms de fichiers
const add2ToEndCheckbox = document.getElementById("add2ToEnd");

// Ajouter un écouteur d'événement pour détecter le changement d'état de la case à cocher
add2ToEndCheckbox.addEventListener("change", function() {
    // Modifier les noms de fichiers si la case est cochée
    if (this.checked) {
        files.forEach((file, index) => {
            files[index] = file.replace(/\.txt$/, "2.txt");
        });
    } else {
        // Rétablir les noms de fichiers originaux si la case est décochée
        files.forEach((file, index) => {
            files[index] = file.replace(/2\.txt$/, ".txt");
        });
    }
    // Mettre à jour la syllabe avec les nouveaux fichiers si nécessaire
    updateSyllabe();
});

function changerPolice() {
        const policeSelectionnee = document.getElementById("police").value;
        const syllabe = document.getElementById("syllabe"); // Sélectionnez l'élément <p> contenant les syllabes

        // Mettez à jour la police de l'élément <p> contenant les syllabes
        syllabe.style.fontFamily = policeSelectionnee;
    }

    // Appel initial pour appliquer la police par défaut
    changerPolice();

// Mettre en place l'intervalle initial avec un délai de 6000 millisecondes
intervalID = setInterval(updateSyllabe, 6000);

function add2ToFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const files = fileInput.files;

            if (files.length === 0) {
                status.textContent = 'Veuillez sélectionner des fichiers.';
                return;
            }

            for (const file of files) {
                const reader = new FileReader();
                
                reader.onload = (function(file) {
                    return function(e) {
                        const content = e.target.result + '2';
                        const newBlob = new Blob([content], { type: 'text/plain' });
                        const newFileName = file.name;
                        const newFileLink = document.createElement('a');
                        
                        newFileLink.href = URL.createObjectURL(newBlob);
                        newFileLink.download = newFileName;
                        newFileLink.textContent = `Télécharger ${newFileName}`;
                        newFileLink.style.display = 'block';
                        
                        document.body.appendChild(newFileLink);
                    };
                })(file);
                
                reader.readAsText(file);
            }

            status.textContent = 'Le chiffre 2 a été ajouté à la fin des fichiers sélectionnés. Téléchargez les nouveaux fichiers ci-dessous.';
        }

</script>
